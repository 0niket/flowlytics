<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flowlytics - Pretreatment Transporter Simulator</title>
    <link rel="stylesheet" href="./web/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- CONFIG PANEL (always-visible side panel) -->
      <aside class="config-panel" id="configPanel">
        <div class="config-panel__header">
          <div class="config-panel__title">Configuration</div>
          <label class="toggle" style="margin:0;">
            <input id="autoRun" type="checkbox" checked />
            <span>Auto-run</span>
          </label>
        </div>

        <!-- Dynamic config sections rendered by initConfigView() -->
        <div class="config-view" id="configViewRoot">
          <!-- Rendered dynamically by renderer.ts -->
        </div>
      </aside>


      <!-- MAIN DASHBOARD -->
      <main class="dashboard">
        <!-- Top Bar -->
        <div class="topbar">
          <div class="topbar__left">
            <div class="topbar__brand">Flowlytics</div>
            <div class="topbar__version mono small">Pretreatment Simulator</div>
          </div>
          <div class="topbar__right">
            <button id="glossaryBtn" class="btn btn--sm" type="button">Glossary</button>
            <button id="themeToggleBtn" class="btn btn--sm btn--icon" type="button" title="Toggle light/dark mode" aria-label="Toggle theme">&#9790;</button>
          </div>
        </div>

        <!-- Constraints -->
        <div class="metrics-panel">
          <div class="metrics-content" id="tabConstraints">
            <div id="constraintsBody"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Glossary Page (dynamically rendered) -->
    <div class="glossary-overlay" id="glossaryOverlay" hidden>
      <div class="glossary">
        <div class="glossary__header">
          <div class="glossary__title">Glossary</div>
          <div class="glossary__search-wrap">
            <input id="glossarySearch" class="glossary__search" type="text" placeholder="Search terms..." autocomplete="off" />
          </div>
          <button id="glossaryCloseBtn" class="glossary__close" type="button">&times;</button>
        </div>
        <div class="glossary__count" id="glossaryCount"></div>
        <div class="glossary__body" id="glossaryBody"></div>
      </div>
    </div>

    <input id="filePicker" type="file" accept=".json,.csv" multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
